{% extends 'base.html' %}

{% block header %}
   <h1>{% block title %}Register{% endblock %}</h1>
{% endblock %}

{% block content %}
   <form method="post">
      <label for="family_code">Family Code</label>
      <input name="family_code" id="family_code">
      <label for="password">Family Password</label>
      <input type="password" name="password" id="password">
      <input type="submit" value="Join Family">
   </form>
{% endblock %}
